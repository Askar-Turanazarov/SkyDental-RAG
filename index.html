<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <title>SkyDental — цифровая стоматология в Ташкенте</title>
    <meta
      name="description"
      content="Стоматология SkyDental в Ташкенте: имплантация, прозрачные алайнеры, керамические коронки, гигиена и детский приём. Цифровой протокол, свой зубной техник, гарантия на работы."
    />
    <!-- Цвет строки статуса. Без media-вариантов: тему ведёт JS,
         и ThemeContext переписывает content при каждом переключении. -->
    <meta name="theme-color" content="#ffffff" />

    <!--
      Тема до первой отрисовки. Скрипт синхронный и стоит в <head>
      намеренно: если выставлять data-theme из React, между разбором
      HTML и гидрацией мелькнёт светлый фон. Логика повторяет
      ThemeContext ровно в одном: как сохранённый выбор превращается
      в light/dark. Ключ хранилища должен совпадать со STORAGE_KEY.
    -->
    <script>
      (function () {
        var pref = 'auto'
        try {
          pref = localStorage.getItem('skydental.theme') || 'auto'
        } catch (e) {
          /* приватный режим — читаем систему */
        }
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SkyDental — цифровая стоматология в Ташкенте" />
    <meta
      property="og:description"
      content="Керамика, которая не отличается от вашей эмали. Цифровой протокол, свой зубной техник, гарантия на работы."
    />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="uz_UZ" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "SkyDental",
        "description": "Цифровая стоматология в Ташкенте",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "ул. Амира Темура, 108",
          "addressLocality": "Ташкент",
          "addressCountry": "UZ"
        },
        "telephone": "+998711234567",
        "priceRange": "$$",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:00",
            "closes": "20:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
